<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Advent">
<meta name="theme-color" content="#120d0a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Sidneys Adventskalender</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;overscroll-behavior:none}
body{background:#120d0a;color:#f9f0d7;font-family:Georgia,'Times New Roman',serif;
 min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
 padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
 -webkit-user-select:none;user-select:none;overflow-x:hidden}
/* unscharfe Szene als Hintergrund für die Ränder */
body::before{content:'';position:fixed;inset:-40px;background:url(images/scene.jpg) center/cover;filter:blur(24px) brightness(.45) saturate(1.2);z-index:-1}
/* Die Szene: Bild 558×1000, alle Positionen in Prozent davon */
#stage{position:relative;container-type:inline-size;aspect-ratio:558/1000;
 width:min(100vw,calc((100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom))*.558));
 width:min(100vw,calc((100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom))*.558));
 background:url(images/scene.jpg) center/100% 100%;box-shadow:0 0 60px #000c;overflow:hidden}
header{position:absolute;left:43%;right:1%;top:3.2%;text-align:center;pointer-events:none}
h1{margin:0;font-weight:normal;font-size:6.4cqw;line-height:1.1;color:#ffe0a2;text-shadow:0 1px 3px #000,0 0 14px #ffc96c66}
#sub{margin:1.4cqw 0 0;font-size:2.9cqw;color:#e4ecef;text-shadow:0 1px 3px #000}
/* Kaminfeuer-Flackern */
/* Flammen (Canvas) genau über der Kaminöffnung, Bild-px x 20–117, y 632–757 */
#fire{position:absolute;left:3.6%;top:63.2%;width:17.4%;height:12.5%;pointer-events:none;mix-blend-mode:screen}
/* warmer Lichtschein auf Raum und Boden */
#glow{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;
 background:radial-gradient(ellipse 42% 30% at 12% 70%,#ff8a2a,transparent 70%);animation:flick 1.7s infinite}
/* Lichterketten an Baum und Kranz */
#lights{position:absolute;inset:0;pointer-events:none}
.lt{position:absolute;width:1.5cqw;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);mix-blend-mode:screen;
 background:radial-gradient(circle,#fff 0,var(--c) 30%,color-mix(in srgb,var(--c) 35%,transparent) 55%,transparent 72%);
 animation:tw var(--d) ease-in-out var(--o) infinite alternate}
@keyframes tw{0%{opacity:.12;transform:translate(-50%,-50%) scale(.7)}100%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}}
.halo{position:absolute;border-radius:50%;transform:translate(-50%,-50%);mix-blend-mode:screen;animation:breathe 3s ease-in-out infinite alternate}
@keyframes breathe{from{opacity:.45}to{opacity:.9}}
@keyframes flick{0%{opacity:.55}18%{opacity:.8}33%{opacity:.6}52%{opacity:.95}70%{opacity:.65}86%{opacity:.85}100%{opacity:.55}}
/* Anhänger: unsichtbare Fläche über dem gemalten Anhänger */
.door{position:absolute;padding:0;border:0;background:none;font:inherit;color:inherit;cursor:pointer;perspective:400px}
.tag{position:absolute;inset:0;display:block;clip-path:polygon(16% 0,84% 0,100% 11%,100% 100%,0 100%,0 11%);
 background:linear-gradient(160deg,#f3d79a,#9c7a45);padding:1.6px;transform-origin:50% 0;
 transform:rotateX(-95deg);opacity:0;transition:transform .9s cubic-bezier(.25,1.4,.4,1),opacity .2s}
.tag img{width:100%;height:100%;object-fit:cover;display:block;clip-path:inherit}
.tag b{position:absolute;left:0;right:0;bottom:4%;text-align:center;font-size:3.4cqw;color:#ffe9b8;text-shadow:0 1px 2px #000,0 0 4px #000}
.tag::before{content:'';position:absolute;left:calc(50% - 2.5%);top:6%;width:5%;aspect-ratio:1;border-radius:50%;background:#2a1c10;box-shadow:0 0 0 1px #f3d79a;z-index:1;
 width:1cqw;left:calc(50% - .5cqw)}
.door.open .tag{transform:none;opacity:1}
.door.today::after{content:'';position:absolute;inset:-6%;border-radius:12%;box-shadow:0 0 0 2px #ffe0a2,0 0 14px 4px #ffcf70;animation:glow 1.6s ease-in-out infinite alternate;pointer-events:none}
@keyframes glow{from{opacity:.35}to{opacity:1}}
.door.shake{animation:shake .45s}
@keyframes shake{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.door{transform-origin:50% -10%}
body.test-mode .door{outline:1px dashed #0ff8}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 70px);transform:translate(-50%,20px);background:#fbf1dc;color:#3a2412;
 padding:10px 18px;border-radius:20px;opacity:0;transition:.3s;z-index:20;pointer-events:none;font-weight:bold;box-shadow:0 4px 16px #0008}
#toast.on{opacity:1;transform:translate(-50%,0)}
#modal{position:fixed;inset:0;z-index:10;background:#140d08ee;display:none;flex-direction:column;align-items:center;justify-content:center;
 padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
#modal.on{display:flex;animation:fade .3s}
@keyframes fade{from{opacity:0}}
#modal figure{margin:0;text-align:center;max-width:100%}
#modal img{width:min(88vw,760px);max-width:100%;max-height:78vh;object-fit:contain;border-radius:14px;border:3px solid #d9b77a;box-shadow:0 10px 40px #000a;animation:pop .5s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:scale(.6) rotate(-4deg);opacity:0}}
figcaption{margin-top:14px;font-size:1.25rem;color:#ffe0a2}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:#ffffff26;color:#fff;font-size:1.4rem}
#prev{left:8px}#next{right:8px}.nav[disabled]{opacity:.2}
#x{position:absolute;right:14px;top:calc(env(safe-area-inset-top) + 12px);width:42px;height:42px;border-radius:50%;border:0;background:#ffffff26;color:#fff;font-size:1.3rem}
#testbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:#000c;padding:10px 14px calc(env(safe-area-inset-bottom) + 10px);display:flex;gap:10px;align-items:center;font:14px sans-serif}
#testbar input{flex:1}#testbar button{padding:6px 10px}
</style>
</head>
<body>
<div id="stage">
 <header><h1>Sidneys Adventskalender</h1><p id="sub"></p></header>
 <div id="glow"></div><canvas id="fire"></canvas><div id="lights"></div>
</div>
<div id="toast"></div>
<div id="modal"><button id="x" aria-label="Schließen">✕</button><button class="nav" id="prev">‹</button><button class="nav" id="next">›</button>
<figure><img id="big" alt=""><figcaption id="cap"></figcaption></figure></div>
<script>
(()=>{
const $=s=>document.querySelector(s), pad=n=>String(n).padStart(2,'0');
const IMG=n=>`images/final/${pad(n)}.jpg`, PH=n=>`images/platzhalter/${pad(n)}.svg`;
const CAPTIONS={}; // optional, z. B. {1:"Unser erster Schnee", 2:"..."}
// Position der gemalten Anhänger im Bild (558×1000 px): x, y, Breite, Höhe
const TAGS=[,
 [242,250,40,84],[289,245,42,84],[337,238,42,88],[390,232,42,88],[444,225,44,90],[500,218,44,92],
 [243,352,38,80],[289,348,40,82],[337,345,42,84],[390,340,42,86],[443,337,44,88],[500,333,44,90],
 [243,452,38,78],[289,450,40,80],[337,448,42,82],[390,446,42,84],[445,446,44,86],[500,445,44,88],
 [245,550,34,60],[290,550,40,82],[338,552,42,84],[391,555,42,84],[445,556,44,88],[500,556,44,90]];
const test=new URLSearchParams(location.search).has('test');
let sim=null, opened=new Set(), shown=0, flipped=0; // flipped = gerade aufgeklappter Anhänger
try{opened=new Set(JSON.parse(localStorage.getItem('adv-opened')||'[]'))}catch(e){}
const save=()=>{try{localStorage.setItem('adv-opened',JSON.stringify([...opened]))}catch(e){}};
// Aktueller Tag (Ortszeit des Geräts): Dez = Tag, nach Weihnachten bis Feb alles offen, sonst gesperrt
function cur(){if(sim!==null)return sim;const d=new Date(),m=d.getMonth();return m===11?Math.min(d.getDate(),24):m<2?24:0}
function wait(n){const c=cur();if(sim!==null||c>0)return n-c;const d=new Date();return Math.ceil((new Date(d.getFullYear(),11,1)-d)/864e5)+n-1}
function setImg(img,n){img.onerror=()=>{img.onerror=null;img.src=PH(n)};img.src=IMG(n)}
const stage=$('#stage');
for(let n=1;n<=24;n++){const [x,y,w,h]=TAGS[n],b=document.createElement('button');b.className='door';b.dataset.n=n;
 Object.assign(b.style,{left:x/5.58+'%',top:y/10+'%',width:w/5.58+'%',height:h/10+'%'});
 b.innerHTML=`<span class="tag"><img alt=""><b>${n}</b></span>`;b.setAttribute('aria-label','Türchen '+n);stage.append(b)}
function render(){const c=cur();
 stage.querySelectorAll('.door').forEach(b=>{const n=+b.dataset.n,lock=n>c,op=!lock&&n===flipped,img=b.querySelector('img');
  b.classList.toggle('locked',lock);b.classList.toggle('open',op);b.classList.toggle('today',n===c&&!opened.has(n));if(op&&!img.getAttribute('src'))setImg(img,n)});
 $('#sub').textContent=c===0?'Noch ein bisschen Geduld …':c<24?`Heute darfst du Türchen ${c} öffnen ✨`:'Frohe Weihnachten! 🎅'}
let tt;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),1800)}
stage.onclick=e=>{const b=e.target.closest('.door');if(!b)return;const n=+b.dataset.n;
 if(n>cur()){const w=wait(n);b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');
  toast(w===1?'Noch 1 Tag – morgen ist es soweit!':`Noch ${w} Tage Geduld`);navigator.vibrate&&navigator.vibrate(30);return}
 if(flipped)return;
 flipped=n;opened.add(n);save();render();setTimeout(()=>show(n),950)};
function show(n){shown=n;flipped=n;opened.add(n);save();render();setImg($('#big'),n);
 $('#cap').textContent=`Türchen ${n}`+(CAPTIONS[n]?` – ${CAPTIONS[n]}`:'');
 $('#prev').disabled=n<=1;$('#next').disabled=n>=cur();$('#modal').classList.add('on')}
const hide=()=>{$('#modal').classList.remove('on');flipped=0;render()}; // Anhänger klappt wieder zu
$('#x').onclick=hide;$('#modal').onclick=e=>{if(e.target.id==='modal')hide()};
$('#prev').onclick=()=>shown>1&&show(shown-1);$('#next').onclick=()=>shown<cur()&&show(shown+1);
addEventListener('keydown',e=>{if(e.key==='Escape')hide()});
let sx=0;$('#modal').addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
$('#modal').addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-sx;if(d>60&&shown>1)show(shown-1);else if(d<-60&&shown<cur())show(shown+1)});
// Testmodus: index.html?test  (zeigt auch die Tippflächen gestrichelt an)
if(test){document.body.classList.add('test-mode');const t=document.createElement('div');t.id='testbar';
 t.innerHTML='<span>Tag: <b id="tv">auto</b></span><input id="tr" type="range" min="-1" max="24" value="-1"><button id="rs">Reset</button>';document.body.append(t);
 $('#tr').oninput=e=>{const v=+e.target.value;sim=v<0?null:v;$('#tv').textContent=v<0?'auto':v;render()};
 $('#rs').onclick=()=>{opened.clear();save();render()};
 const q=new URLSearchParams(location.search);if(q.has('day')){sim=+q.get('day');$('#tr').value=sim;$('#tv').textContent=sim;
  if(q.has('open'))for(let n=1;n<=sim;n++)if(n<sim)opened.add(n)}}
render();setInterval(render,60000);document.addEventListener('visibilitychange',render);
// Lichter an Baum und Kranz (Positionen in Bild-px 558×1000)
{const L=$('#lights'),R=(a,b)=>a+Math.random()*(b-a),C=['#ffe6a0','#ffd27a','#fff3d0','#ffb347'],CW=['#ffe6a0','#ff6b5a','#ffd27a','#fff3d0'];
 const dot=(x,y,c,s=1)=>{const e=document.createElement('i');e.className='lt';
  Object.assign(e.style,{left:x/5.58+'%',top:y/10+'%',width:1.5*s+'cqw'});
  e.style.setProperty('--c',c);e.style.setProperty('--d',R(.8,2.2)+'s');e.style.setProperty('--o',-R(0,3)+'s');L.append(e)};
 const halo=(x,y,w,h,c)=>{const e=document.createElement('i');e.className='halo';
  Object.assign(e.style,{left:x/5.58+'%',top:y/10+'%',width:w/5.58+'%',height:h/10+'%',background:`radial-gradient(closest-side,${c},transparent)`});L.append(e)};
 halo(198,480,150,300,'#ffc86a40');halo(72,345,130,150,'#ffcf7a30');halo(188,346,40,40,'#fff2b8aa');
 // Baum: Dreieck Spitze (188,368), unten y 610 von x 158 bis 240 – Lichter in Girlanden-Reihen
 for(let y=378;y<605;y+=11){const t=(y-368)/242,hw=t*44,cx=196+t*4;
  for(let k=0,n=Math.max(1,Math.round(hw/9));k<n;k++)dot(cx-hw*.92+(2*hw*.92)*(k+R(.2,.8))/n,y+R(-4,4),C[Math.random()*4|0],R(.8,1.2))}
 // Kranz: Ring um (72,345)
 for(let i=0;i<22;i++){const a=i/22*Math.PI*2+R(-.08,.08),r=R(.8,1.05);dot(72+Math.cos(a)*38*r,345+Math.sin(a)*44*r,CW[i%4],R(.8,1.1))}
 dot(188,346,'#fff6c8',3.2)}
// Kaminfeuer: aufsteigende Flammen-Partikel
const fc=$('#fire'),fx=fc.getContext('2d');let FW,FH;
function fsize(){const r=devicePixelRatio||1;FW=fc.clientWidth;FH=fc.clientHeight;fc.width=FW*r;fc.height=FH*r;fx.setTransform(r,0,0,r,0,0)}
fsize();addEventListener('resize',fsize);
const calm=matchMedia('(prefers-reduced-motion:reduce)').matches,P=[];
// Glut liegt links-mittig (wie im Bild); Flammen steigen von den Scheiten auf
function spawn(){const u=Math.random(),c=.42;P.push({x:FW*(.06+.8*u),y:FH*(.78+Math.random()*.12),
 vx:(Math.random()-.5)*.3,vy:-(.5+Math.random()*.7)*FH/100,r:FW*(.06+Math.random()*.08)*(1.1-Math.abs(u-c)),life:0,max:35+Math.random()*35})}
let fl=1;
(function burn(){fx.clearRect(0,0,FW,FH);fx.globalCompositeOperation='lighter';
 fl+=(.7+Math.random()*.6-fl)*.15;const hg=fx.createRadialGradient(FW*.4,FH*.8,0,FW*.4,FH*.8,FW*.6);hg.addColorStop(0,`rgba(255,120,30,${.3*fl})`);hg.addColorStop(1,'rgba(255,120,30,0)');
 fx.fillStyle=hg;fx.fillRect(0,0,FW,FH);
 for(let i=0;i<(calm?1:5);i++)spawn();
 for(let i=P.length-1;i>=0;i--){const p=P[i],t=p.life/p.max;p.life++;p.x+=p.vx+Math.sin((p.life+i)*.25)*.15;p.y+=p.vy;
  if(t>=1){P.splice(i,1);continue}
  const r=p.r*(1-t*.7),g=fx.createRadialGradient(p.x,p.y,0,p.x,p.y,r),a=(1-t)*.8*fl;
  g.addColorStop(0,`rgba(255,${230-150*t|0},${120-120*t|0},${a})`);g.addColorStop(.5,`rgba(255,${120-90*t|0},20,${a*.5})`);g.addColorStop(1,'rgba(200,30,0,0)');
  fx.fillStyle=g;fx.beginPath();fx.arc(p.x,p.y,r,0,7);fx.fill()}
 // gelegentliche Funken
 if(Math.random()<.06)P.push({x:FW*(.3+Math.random()*.4),y:FH*.85,vx:(Math.random()-.5)*.6,vy:-FH/55,r:1.2,life:0,max:30});
 requestAnimationFrame(burn)})();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>
</body>
</html>
