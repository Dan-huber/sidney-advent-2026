<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Advent">
<meta name="theme-color" content="#14213d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Adventskalender</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;overscroll-behavior:none}
body{background:linear-gradient(170deg,#0b1a3a,#2b1055 70%,#5b2a86) fixed;color:#fff;
 font-family:'Chalkboard SE','Marker Felt','Comic Sans MS',cursive,sans-serif;
 padding:env(safe-area-inset-top) 14px calc(env(safe-area-inset-bottom) + 20px);-webkit-user-select:none;user-select:none}
header{text-align:center;padding:22px 0 14px}
h1{margin:0;font-size:2rem;text-shadow:0 2px 12px #0008}
#sub{margin:6px 0 0;opacity:.85;font-size:.95rem}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:520px;margin:0 auto}
.door{position:relative;aspect-ratio:1;padding:0;border:0;background:none;perspective:700px;font:inherit;color:inherit}
.inner,.front{position:absolute;inset:0;border-radius:12px}
.inner{overflow:hidden;background:#ffffff22;box-shadow:inset 0 0 12px #0008}
.inner img{width:100%;height:100%;object-fit:cover;display:block}
.front{display:grid;place-items:center;font-size:1.7rem;font-weight:bold;background:var(--c);
 transform-origin:left center;transition:transform .9s cubic-bezier(.3,.7,.2,1);backface-visibility:hidden;
 box-shadow:0 4px 10px #0006,inset 0 0 0 3px #ffffff40;text-shadow:0 2px 3px #0006}
.front::after{content:'';position:absolute;right:9px;top:50%;width:7px;height:7px;border-radius:50%;background:#ffd86b}
.door:nth-child(4n+1){--c:#c0392b}.door:nth-child(4n+2){--c:#1e8449}
.door:nth-child(4n+3){--c:#b9770e}.door:nth-child(4n){--c:#2471a3}
.door.open .front{transform:rotateY(-118deg)}
.door.locked .front{filter:saturate(.35) brightness(.65)}
.door.locked .front::before{content:'🔒';position:absolute;left:6px;bottom:4px;font-size:.8rem}
.door.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px) rotate(-3deg)}75%{transform:translateX(6px) rotate(3deg)}}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 70px);transform:translate(-50%,20px);background:#fff;color:#2b1055;
 padding:10px 18px;border-radius:20px;opacity:0;transition:.3s;z-index:20;pointer-events:none;font-weight:bold}
#toast.on{opacity:1;transform:translate(-50%,0)}
#modal{position:fixed;inset:0;z-index:10;background:#0b0620ee;display:none;flex-direction:column;align-items:center;justify-content:center;
 padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
#modal.on{display:flex;animation:fade .3s}
@keyframes fade{from{opacity:0}}
#modal figure{margin:0;text-align:center;max-width:100%}
#modal img{max-width:100%;max-height:72vh;border-radius:14px;box-shadow:0 10px 40px #000a;animation:pop .5s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:scale(.6) rotate(-4deg);opacity:0}}
figcaption{margin-top:14px;font-size:1.2rem}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:#ffffff33;color:#fff;font-size:1.4rem}
#prev{left:8px}#next{right:8px}.nav[disabled]{opacity:.2}
#x{position:absolute;right:14px;top:calc(env(safe-area-inset-top) + 12px);width:42px;height:42px;border-radius:50%;border:0;background:#ffffff33;color:#fff;font-size:1.3rem}
#testbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:#000c;padding:10px 14px calc(env(safe-area-inset-bottom) + 10px);display:flex;gap:10px;align-items:center;font:14px sans-serif}
#testbar input{flex:1}#testbar button{padding:6px 10px}
</style>
</head>
<body>
<header><h1>🎄 Adventskalender</h1><p id="sub"></p></header>
<main id="grid"></main>
<canvas id="snow"></canvas>
<div id="toast"></div>
<div id="modal"><button id="x" aria-label="Schließen">✕</button><button class="nav" id="prev">‹</button><button class="nav" id="next">›</button>
<figure><img id="big" alt=""><figcaption id="cap"></figcaption></figure></div>
<script>
(()=>{
const $=s=>document.querySelector(s), pad=n=>String(n).padStart(2,'0');
const IMG=n=>`images/${pad(n)}.jpg`, PH=n=>`images/platzhalter/${pad(n)}.svg`;
const CAPTIONS={}; // optional, z. B. {1:"Unser erster Schnee", 2:"..."}
const test=new URLSearchParams(location.search).has('test');
let sim=null, opened=new Set(), shown=0;
try{opened=new Set(JSON.parse(localStorage.getItem('adv-opened')||'[]'))}catch(e){}
const save=()=>{try{localStorage.setItem('adv-opened',JSON.stringify([...opened]))}catch(e){}};
// Aktueller Tag (Ortszeit des Geräts): Dez = Tag, nach Weihnachten bis Feb alles offen, sonst gesperrt
function cur(){if(sim!==null)return sim;const d=new Date(),m=d.getMonth();return m===11?Math.min(d.getDate(),24):m<2?24:0}
function wait(n){const c=cur();if(sim!==null||c>0)return n-c;const d=new Date();return Math.ceil((new Date(d.getFullYear(),11,1)-d)/864e5)+n-1}
function setImg(img,n){img.onerror=()=>{img.onerror=null;img.src=PH(n)};img.src=IMG(n)}
const grid=$('#grid');
for(let n=1;n<=24;n++){const b=document.createElement('button');b.className='door';b.dataset.n=n;
 b.innerHTML=`<span class="inner"><img alt=""></span><span class="front">${n}</span>`;b.setAttribute('aria-label','Türchen '+n);grid.append(b)}
function render(){const c=cur();
 grid.querySelectorAll('.door').forEach(b=>{const n=+b.dataset.n,lock=n>c,op=!lock&&opened.has(n),img=b.querySelector('img');
  b.classList.toggle('locked',lock);b.classList.toggle('open',op);if(op&&!img.getAttribute('src'))setImg(img,n)});
 $('#sub').textContent=c===0?'Noch ein bisschen Geduld …':c<24?`Heute darfst du Türchen ${c} öffnen ✨`:'Frohe Weihnachten! 🎅 Alle Türchen sind offen'}
let tt;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),1800)}
grid.onclick=e=>{const b=e.target.closest('.door');if(!b)return;const n=+b.dataset.n;
 if(n>cur()){const w=wait(n);b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');
  toast(w===1?'Noch 1 Tag – morgen ist es soweit!':`Noch ${w} Tage Geduld`);navigator.vibrate&&navigator.vibrate(30);return}
 if(opened.has(n))return show(n);
 opened.add(n);save();render();setTimeout(()=>show(n),850)};
function show(n){shown=n;opened.add(n);save();render();setImg($('#big'),n);
 $('#cap').textContent=`Türchen ${n}`+(CAPTIONS[n]?` – ${CAPTIONS[n]}`:'');
 $('#prev').disabled=n<=1;$('#next').disabled=n>=cur();$('#modal').classList.add('on')}
const hide=()=>$('#modal').classList.remove('on');
$('#x').onclick=hide;$('#modal').onclick=e=>{if(e.target.id==='modal')hide()};
$('#prev').onclick=()=>shown>1&&show(shown-1);$('#next').onclick=()=>shown<cur()&&show(shown+1);
addEventListener('keydown',e=>{if(e.key==='Escape')hide()});
let sx=0;$('#modal').addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
$('#modal').addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-sx;if(d>60&&shown>1)show(shown-1);else if(d<-60&&shown<cur())show(shown+1)});
// Testmodus: index.html?test
if(test){const t=document.createElement('div');t.id='testbar';
 t.innerHTML='<span>Tag: <b id="tv">auto</b></span><input id="tr" type="range" min="-1" max="24" value="-1"><button id="rs">Reset</button>';document.body.append(t);
 $('#tr').oninput=e=>{const v=+e.target.value;sim=v<0?null:v;$('#tv').textContent=v<0?'auto':v;render()};
 $('#rs').onclick=()=>{opened.clear();save();render()}}
render();setInterval(render,60000);document.addEventListener('visibilitychange',render);
// Schnee
const cv=$('#snow'),cx=cv.getContext('2d');let W,H;
function size(){const r=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*r;cv.height=H*r;cx.setTransform(r,0,0,r,0,0)}
size();addEventListener('resize',size);
const N=matchMedia('(prefers-reduced-motion:reduce)').matches?25:90,fl=[];
for(let i=0;i<N;i++)fl.push({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*3,s:.4+Math.random()*1.1,p:Math.random()*6});
(function tick(t){cx.clearRect(0,0,W,H);cx.fillStyle='rgba(255,255,255,.85)';
 for(const f of fl){f.y+=f.s;f.x+=Math.sin(t/1500+f.p)*.4;if(f.y>H+5){f.y=-5;f.x=Math.random()*W}cx.beginPath();cx.arc(f.x,f.y,f.r,0,7);cx.fill()}
 requestAnimationFrame(tick)})(0);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>
</body>
</html>
